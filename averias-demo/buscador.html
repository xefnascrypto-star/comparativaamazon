<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Buscador de averías | SolucionaAverías</title><style>body{margin:0;font-family:system-ui;background:#f7f9fc;color:#172033}.wrap{max-width:900px;margin:auto;padding:25px}header{background:#fff;border-bottom:1px solid #e5eaf1}a{color:#1769e0;text-decoration:none}.hero{padding:60px 0}.search{display:flex;gap:10px;background:#fff;border:1px solid #e5eaf1;padding:12px;border-radius:16px;box-shadow:0 10px 30px #dfe7f3}input{flex:1;border:0;outline:0;font-size:18px;padding:12px}button{border:0;background:#1769e0;color:#fff;border-radius:10px;padding:13px 20px;font-weight:800}.results{margin-top:22px;display:grid;gap:10px}.r{background:#fff;border:1px solid #e5eaf1;border-radius:13px;padding:17px}.r b{display:block;font-size:18px}.muted{color:#68758a}h1{font-size:42px}@media(max-width:600px){h1{font-size:34px}.search{display:grid}}</style></head><body><header><div class="wrap"><a href="index.html">← SolucionaAverías</a> · <a href="marcas.html">Marcas</a></div></header><main class="wrap hero"><h1>Busca tu avería</h1><p class="muted">Prueba: “Bosch E18”, “Balay E24”, “LG OE”, “LG no desagua” o simplemente un código.</p><div class="search"><input id="q" autofocus placeholder="Marca + código o síntoma"><button onclick="go()">Buscar</button></div><div id="results" class="results"></div></main><script>const data=[['Bosch E18','Lavadora · problema de desagüe','bosch-e18.html','bosch e18 lavadora no desagua desague filtro bomba'],['Balay E23','Lavavajillas · bomba de desagüe','balay-e23.html','balay e23 lavavajillas bomba desague'],['Balay E24','Lavavajillas · desagüe','balay-e24.html','balay e24 lavavajillas no desagua desague tubo'],['Balay E25','Lavavajillas · bomba bloqueada','balay-e25.html','balay e25 lavavajillas bomba bloqueada desague'],['Balay E27','Lavavajillas · tensión eléctrica','balay-e27.html','balay e27 lavavajillas tension voltaje electricidad'],['LG IE','Lavadora · entrada de agua','lg-ie.html','lg ie lavadora entrada agua no carga agua'],['LG OE','Lavadora · no desagua','lg-oe.html','lg oe lavadora no desagua desague filtro tubo'],['LG UE','Lavadora · carga desequilibrada','lg-ue.html','lg ue lavadora desequilibrio centrifugado no centrifuga'],['LG LE','Lavadora · motor bloqueado','lg-le.html','lg le lavadora motor bloqueado tambor']];function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function go(){let q=norm(document.getElementById('q').value.trim());let box=document.getElementById('results');if(!q){box.innerHTML='<div class="r">Escribe una marca, código o síntoma.</div>';return}let terms=q.split(/\s+/);let hits=data.map(x=>[x,terms.filter(t=>norm(x[3]).includes(t)).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);if(!hits.length){box.innerHTML='<div class="r"><b>Aún no tenemos esa avería</b><span class="muted">La base de datos está en construcción. Prueba Bosch E18, Balay E24 o LG OE.</span></div>';return}box.innerHTML=hits.map(h=>'<a class="r" href="'+h[0][2]+'"><b>'+h[0][0]+'</b><span class="muted">'+h[0][1]+'</span></a>').join('')}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go()});let p=new URLSearchParams(location.search).get('q');if(p){document.getElementById('q').value=p;go()}</script></body></html>
